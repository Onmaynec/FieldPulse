services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: fieldpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpulse"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fieldpulse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-dev-object-storage}
    volumes:
      - minio_data:/data
  migrate:
    build: .
    command: alembic upgrade head
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://fieldpulse:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/fieldpulse
      SESSION_SECRET: ${SESSION_SECRET:-set-a-random-production-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fieldpulse
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fieldpulse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-object-storage}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-FieldPulseDemo!2026}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    build: .
    command: python -m app.seed
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: .
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 10
  worker:
    build: .
    command: python -m app.worker
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health", "--check"]
      interval: 30s
      timeout: 6s
      start_period: 35s
      retries: 2
volumes:
  postgres_data:
  minio_data:

  monitor:
    build: .
    command: python -m app.monitor
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.monitor", "--check"]
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 2

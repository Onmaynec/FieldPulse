services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: fieldpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpulse"]
      interval: 5s
      timeout: 3s
      retries: 15
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fieldpulse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-dev-object-storage}
    volumes:
      - minio_data:/data
  migrate:
    build: .
    command: alembic upgrade head
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://fieldpulse:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/fieldpulse
      SESSION_SECRET: ${SESSION_SECRET:-set-a-random-production-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: fieldpulse
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fieldpulse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-dev-object-storage}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-FieldPulseDemo!2026}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    build: .
    command: python -m app.seed
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: .
    ports:
      - "8000:8000"
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 10
  backup-tool:
    profiles: ["maintenance"]
    build: .
    command: ["python", "-c", "import time; time.sleep(3600)"]
    environment: *app_env
    volumes:
      - ${BACKUP_ARTIFACTS_DIR:-./.recovery}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
  worker:
    restart: unless-stopped
    build: .
    command: python -m app.worker
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health", "--check"]
      interval: 30s
      timeout: 6s
      start_period: 35s
      retries: 2
  monitor:
    restart: unless-stopped
    build: .
    command: python -m app.monitor
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.monitor", "--check"]
      interval: 30s
      timeout: 6s
      start_period: 40s
      retries: 2
  recovery-postgres:
    profiles: ["recovery"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: ${RECOVERY_POSTGRES_PASSWORD:-recovery-ci-only-password}
      POSTGRES_DB: fieldpulse_recovery
    volumes:
      - recovery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d fieldpulse_recovery"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [recovery_net]
  recovery-minio:
    profiles: ["recovery"]
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RECOVERY_S3_ACCESS_KEY:-recovery}
      MINIO_ROOT_PASSWORD: ${RECOVERY_S3_SECRET_KEY:-recovery-ci-only-storage}
    volumes:
      - recovery_minio_data:/data
    networks: [recovery_net]
  recovery-api:
    profiles: ["recovery"]
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &recovery_env
      DATABASE_URL: postgresql+psycopg://recovery:${RECOVERY_POSTGRES_PASSWORD:-recovery-ci-only-password}@recovery-postgres:5432/fieldpulse_recovery
      SESSION_SECRET: ${SESSION_SECRET:-set-a-random-production-secret}
      COOKIE_SECURE: "0"
      S3_ENDPOINT: http://recovery-minio:9000
      S3_BUCKET: fieldpulse
      S3_ACCESS_KEY: ${RECOVERY_S3_ACCESS_KEY:-recovery}
      S3_SECRET_KEY: ${RECOVERY_S3_SECRET_KEY:-recovery-ci-only-storage}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-FieldPulseDemo!2026}
      ALERT_WEBHOOK_URL: ""
    depends_on:
      recovery-postgres:
        condition: service_healthy
      recovery-minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [recovery_net]
  recovery-tool:
    profiles: ["recovery"]
    build: .
    command: ["python", "-c", "import time; time.sleep(3600)"]
    environment: *recovery_env
    volumes:
      - ${BACKUP_ARTIFACTS_DIR:-./.recovery}:/recovery
    depends_on:
      recovery-postgres:
        condition: service_healthy
      recovery-minio:
        condition: service_started
    networks: [recovery_net]
networks:
  recovery_net:
    internal: true
volumes:
  postgres_data:
  minio_data:
  recovery_postgres_data:
  recovery_minio_data:

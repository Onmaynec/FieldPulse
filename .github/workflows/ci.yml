name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests migrations scripts
      - name: Check critical lint rules
        run: ruff check app tests --select E4,E7,E9,F63,F7,F82
      - name: Test
        run: pytest -q
      - name: Check JavaScript
        run: node --check public/app.js
      - name: Generate OpenAPI
        run: python -c "from app.main import app; assert '/api/v1/mobile/sync' in app.openapi()['paths']"
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: docker build -t fieldpulse:test .
  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot entire stack
        run: docker compose up -d --build
      - name: Wait for API and check seeded data
        shell: bash
        run: |
          for attempt in {1..50}; do
            if curl -fsS http://localhost:8000/health/ready; then
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health/ready
          docker compose run --rm seed
          docker compose exec -T api python -c "from app.db import SessionLocal; from app.models import Ticket,Site; from sqlalchemy import select,func; db=SessionLocal(); assert db.scalar(select(func.count(Ticket.id)))==2000; assert db.scalar(select(func.count(Site.id)))==120; db.close()"
          docker compose exec -T api python scripts/smoke.py
          docker compose exec -T api python -m scripts.search_plan --repeats 5 --expected-min 2000 --output /tmp/fieldpulse-search-plan.json
          docker cp "$(docker compose ps -q api):/tmp/fieldpulse-search-plan.json" fieldpulse-search-plan.json
          docker compose exec -T worker python -m app.worker_health --check
          python -m pip install playwright==1.56.0 Pillow==11.1.0
          python -m playwright install --with-deps chromium
          python scripts/browser_e2e.py
          python scripts/visual_e2e.py
          python scripts/registry_e2e.py
          python scripts/cursor_e2e.py
          python scripts/incidents_e2e.py
          docker compose exec -T api python scripts/concurrency_smoke.py
          docker compose exec -T api python -m app.maintenance --limit 10
          docker compose exec -T api python scripts/load_profile.py --tickets 2 --photos-per-ticket 1 --workers 2 --duration-hours 0.0002 --photo-width 640 --photo-height 480 --allow-writes --output /tmp/fieldpulse-load.json
          docker cp "$(docker compose ps -q api):/tmp/fieldpulse-load.json" fieldpulse-load.json
          docker compose exec -T api python scripts/load_profile.py --tickets 200 --photos-per-ticket 5 --workers 8 --allow-writes --output /tmp/fieldpulse-load-target.json
          docker cp "$(docker compose ps -q api):/tmp/fieldpulse-load-target.json" fieldpulse-load-target.json
          test_ticket=$(docker compose exec -T api python -m scripts.worker_restart_smoke prepare)
          docker compose exec -T api python -m scripts.worker_restart_smoke await "$test_ticket"
          docker compose restart worker
          docker compose exec -T api python -m scripts.worker_restart_smoke verify "$test_ticket"
          mkdir -p .recovery
          chmod 0777 .recovery
          docker compose stop api worker monitor
          docker compose --profile maintenance run --rm backup-tool python -m scripts.recovery_probe snapshot /backups/source.json
          docker compose --profile maintenance run --rm backup-tool python -m app.backup create /backups/fieldpulse-backup.zip --maintenance-confirmed
          docker compose --profile maintenance run --rm backup-tool python -m app.backup verify /backups/fieldpulse-backup.zip
          cp .recovery/fieldpulse-backup.zip .recovery/fieldpulse-backup-truncated.zip
          truncate -s -128 .recovery/fieldpulse-backup-truncated.zip
          if docker compose --profile maintenance run --rm backup-tool python -m app.backup verify /backups/fieldpulse-backup-truncated.zip; then
            echo "A truncated backup was accepted"
            exit 1
          fi
          docker compose -p fieldpulse-recovery --profile recovery up -d recovery-postgres recovery-minio
          docker compose -p fieldpulse-recovery --profile recovery run --rm recovery-tool python -m scripts.recovery_probe init-bucket
          docker compose -p fieldpulse-recovery --profile recovery run --rm recovery-tool python -m app.backup restore /recovery/fieldpulse-backup.zip --confirm-empty
          docker compose -p fieldpulse-recovery --profile recovery up -d recovery-api
          docker compose -p fieldpulse-recovery --profile recovery run --rm recovery-tool python -m scripts.recovery_probe verify /recovery/source.json
      - name: Publish load-profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-v03-load-smoke
          path: |
            fieldpulse-load.json
            fieldpulse-load-target.json
          if-no-files-found: ignore
      - name: Store v0.4 visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-v04-ui-screenshots
          path: visual-artifacts/*.png
          if-no-files-found: ignore
      - name: Store v0.6 PostgreSQL search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-v06-postgres-plans
          path: fieldpulse-search-plan.json
          if-no-files-found: ignore
      - name: Store v0.8 recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-v08-recovery-drill
          path: |
            .recovery/source.json
            .recovery/fieldpulse-backup.zip
            .recovery/fieldpulse-backup-truncated.zip
          if-no-files-found: warn
      - name: Show logs on error
        if: failure()
        run: |
          docker compose logs --tail 150 || true
          docker compose -p fieldpulse-recovery --profile recovery logs --tail 120 || true
      - name: Cleanup isolated recovery stack
        if: always()
        run: docker compose -p fieldpulse-recovery --profile recovery down -v --remove-orphans
      - name: Shutdown
        if: always()
        run: docker compose down -v

  large-search-benchmark:
    # Deliberately separate from the API smoke test. These are real, resource-
    # consuming PostgreSQL profiles with rollback, never a production run.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Start dedicated performance database
        run: |
          docker compose up -d --build postgres migrate api
          docker compose run --rm seed
      - name: Benchmark 50,000 synthetic + seeded tickets
        run: |
          docker compose exec -T api python -m scripts.search_plan --generate 50000 --allow-demo-write --expected-min 52000 --repeats 3 --output /tmp/fieldpulse-50k.json
          docker cp "$(docker compose ps -q api):/tmp/fieldpulse-50k.json" fieldpulse-50k.json
          docker compose exec -T api python -c "from app.db import SessionLocal; from app.models import Ticket; from sqlalchemy import select,func; db=SessionLocal(); assert db.scalar(select(func.count(Ticket.id)))==2000; db.close()"
      - name: Benchmark 200,000 synthetic + seeded tickets
        run: |
          docker compose exec -T api python -m scripts.search_plan --generate 200000 --allow-demo-write --expected-min 202000 --repeats 3 --output /tmp/fieldpulse-200k.json
          docker cp "$(docker compose ps -q api):/tmp/fieldpulse-200k.json" fieldpulse-200k.json
          docker compose exec -T api python -c "from app.db import SessionLocal; from app.models import Ticket; from sqlalchemy import select,func; db=SessionLocal(); assert db.scalar(select(func.count(Ticket.id)))==2000; db.close()"
      - name: Publish large PostgreSQL query plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldpulse-v07-query-scale
          path: |
            fieldpulse-50k.json
            fieldpulse-200k.json
          if-no-files-found: warn
      - name: Show database errors
        if: failure()
        run: docker compose logs --tail 180 postgres migrate api
      - name: Remove dedicated benchmark volumes
        if: always()
        run: docker compose down -v

name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests migrations
      - name: Check critical lint rules
        run: ruff check app tests --select E4,E7,E9,F63,F7,F82
      - name: Test
        run: pytest -q
      - name: Check JavaScript
        run: node --check public/app.js
      - name: Generate OpenAPI
        run: python -c "from app.main import app; assert '/api/v1/mobile/sync' in app.openapi()['paths']"
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application
        run: docker build -t fieldpulse:test .

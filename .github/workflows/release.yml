name: Publish versioned release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish GitHub Release after successful main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re,pathlib; s=pathlib.Path("app/main.py").read_text(); print(re.search(r"version=\"(\d+\.\d+\.\d+)\"",s).group(1))')
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          test -f "$notes" || { echo "Missing release notes: $notes"; exit 1; }
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping"
          else
            gh release create "$tag" --repo "$GH_REPO" --target "$TARGET_SHA" --title "FieldPulse $tag" --notes-file "$notes"
          fi
